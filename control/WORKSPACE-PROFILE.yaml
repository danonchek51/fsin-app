  name: "FSIN app"
  communication_language: "Russian"
  migration_mode: true

codex:
  global_guidance: "optional: ~/.codex/AGENTS.md"
  project_guidance: "AGENTS.md"

continuity:
  method: "git-remote"
  remote_name: "origin"
  evidence_path: null

bmad_install:
  mode: "bootstrap-per-clone"
  installed_version: "6.12.0"
  installer_version_policy: "record actual version after a fresh Core+BMM installation"
