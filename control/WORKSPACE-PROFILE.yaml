  tea: false
  cis: false
  builder: false
  loop: false
  build_auto: false

external_integrations: []

migration:
  state: "restore-pending"
  migration_branch: "workspace/core-bmm-migration-20260910"
  legacy_checkpoint: "10259b0"
  legacy_runtime: "Core+BMM+BMB+CIS+TEA+Loop+GDS; not an active target runtime"
